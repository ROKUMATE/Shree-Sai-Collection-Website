# Local development: just the database.
# Run the app itself with `npm run dev` on your machine.
#   docker compose -f docker-compose.dev.yml up -d

services:
  db:
    image: postgres:17-alpine
    container_name: shringar-db-dev
    environment:
      POSTGRES_USER: shringar
      POSTGRES_PASSWORD: shringar_dev
      POSTGRES_DB: shringar
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shringar -d shringar"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:
