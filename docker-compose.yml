# Production stack: app + PostgreSQL + Caddy (automatic HTTPS).
#
#   1. Copy .env.production.example to .env and fill in real values
#   2. Point your domain's DNS A record at this server
#   3. docker compose up -d --build
#
# Works as-is on any VPS: DigitalOcean droplet, AWS EC2, GCP Compute Engine,
# Lightsail, Hetzner, etc. If you use a managed load balancer / managed HTTPS
# instead, remove the `caddy` service and publish app's port 3000.

services:
  app:
    build: .
    container_name: shringar-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:17-alpine
    container_name: shringar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  caddy:
    image: caddy:2-alpine
    container_name: shringar-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
